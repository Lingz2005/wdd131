<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head><body><header>
  <h1>Product Review Form</h1>
</header><main>
  <form action="review.html" method="get"><!-- Product -->
<label for="product">Product Name</label>
<select id="product" name="product" required>
  <option value="">Select a Product</option>
</select>

<!-- Rating -->
<label for="rating">Overall Rating</label>
<select id="rating" name="rating" required>
  <option value="">Select Rating</option>
  <option value="1">1 ⭐</option>
  <option value="2">2 ⭐⭐</option>
  <option value="3">3 ⭐⭐⭐</option>
  <option value="4">4 ⭐⭐⭐⭐</option>
  <option value="5">5 ⭐⭐⭐⭐⭐</option>
</select>

<!-- Review -->
<label for="review">Written Review</label>
<textarea id="review" name="review" rows="4" required></textarea>

<!-- Name -->
<label for="username">Your Name</label>
<input type="text" id="username" name="username" required>

<!-- Submit -->
<button type="submit">Submit Review</button>

  </form>
</main><footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer></body>
</html>
