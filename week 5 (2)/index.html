<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Review</title>
  <meta name="description" content="Submit a product review">
  <meta name="author" content="Jesse Chisom Nnadi">

  <link rel="stylesheet" href="styles/review.css">
</head>

<body>

<header>
  <h1>Product Review</h1>
</header>

<main>
  <form method="get" action="review.html">

    <!-- PRODUCT -->
    <label for="product">Product Name</label>
    <select id="product" name="product" required>
      <option value="" disabled selected>Choose a Product ...</option>
      <option value="phone">Phone</option>
      <option value="laptop">Laptop</option>
      <option value="tablet">Tablet</option>
    </select>

    <!-- ⭐ RATING -->
    <fieldset>
      <legend>Overall Rating</legend>

      <div class="star-group">

        <label for="rate1">
          ⭐
          <input type="radio" id="rate1" name="rating" value="1" required>
        </label>

        <label for="rate2">
          ⭐⭐
          <input type="radio" id="rate2" name="rating" value="2" required>
        </label>

        <label for="rate3">
          ⭐⭐⭐
          <input type="radio" id="rate3" name="rating" value="3" required>
        </label>

        <label for="rate4">
          ⭐⭐⭐⭐
          <input type="radio" id="rate4" name="rating" value="4" required>
        </label>

        <label for="rate5">
          ⭐⭐⭐⭐⭐
          <input type="radio" id="rate5" name="rating" value="5" required>
        </label>

      </div>
    </fieldset>

    <!-- DATE -->
    <label for="date">Date of Installation</label>
    <input type="date" id="date" name="date" required>

    <!-- FEATURES -->
    <fieldset>
      <legend>Which features did you find useful in the product?</legend>

      <input type="checkbox" id="design" name="features" value="design">
      <label for="design">Design</label>

      <input type="checkbox" id="performance" name="features" value="performance">
      <label for="performance">Performance</label>

      <input type="checkbox" id="battery" name="features" value="battery">
      <label for="battery">Battery</label>

      <input type="checkbox" id="price" name="features" value="price">
      <label for="price">Price</label>
    </fieldset>

    <!-- REVIEW -->
    <label for="review">Additional Comments</label>
    <textarea id="review" name="review" rows="4" placeholder="Write your review here..."></textarea>

    <!-- BUTTON -->
    <button type="submit">Submit Review</button>

  </form>
</main>

<footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer>

</body>
</html>
