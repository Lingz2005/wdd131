<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <meta name="description" content="Submit a product review with rating and installation date.">
  <meta name="author" content="Jesse Chisom Nnadi">  <title>Product Review Form</title>  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head><body><header>
  <h1>Product Review Form</h1>
</header><main>  <form method="get" action="review.html"><div class="form-group">
  <label for="product">Product Name <span class="required">*</span></label>
  <select id="product" name="product" required>
    <option value="" disabled selected>Select a Product...</option>
  </select>
</div>

<div class="form-group">
  <p>Overall Rating <span class="required">*</span></p>

  <input type="radio" id="r1" name="rating" value="1" required>
  <label for="r1">1 ⭐</label>

  <input type="radio" id="r2" name="rating" value="2">
  <label for="r2">2 ⭐⭐</label>

  <input type="radio" id="r3" name="rating" value="3">
  <label for="r3">3 ⭐⭐⭐</label>

  <input type="radio" id="r4" name="rating" value="4">
  <label for="r4">4 ⭐⭐⭐⭐</label>

  <input type="radio" id="r5" name="rating" value="5">
  <label for="r5">5 ⭐⭐⭐⭐⭐</label>
</div>

<div class="form-group">
  <label for="date">Date of Installation <span class="required">*</span></label>
  <input type="date" id="date" name="date" required>
</div>

<div class="form-group">
  <p>Features Used</p>

  <input type="checkbox" id="design" name="features" value="design">
  <label for="design">Design</label>

  <input type="checkbox" id="performance" name="features" value="performance">
  <label for="performance">Performance</label>

  <input type="checkbox" id="battery" name="features" value="battery">
  <label for="battery">Battery</label>

  <input type="checkbox" id="price" name="features" value="price">
  <label for="price">Price</label>
</div>

<div class="form-group">
  <label for="review">Write Review</label>
  <textarea id="review" name="review" rows="4"></textarea>
</div>

<button type="submit">Submit Review</button>

  </form></main><footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer></body>
</html>
