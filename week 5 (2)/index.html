<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home | Product Review</title>
  <meta name="description" content="Submit and track product reviews easily with our Product Review Hub.">
  <meta name="author" content="Jesse Chisom Nnadi">

  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head>

<body>

<header>
  <h1>Product Review Hub</h1>
</header>

<main>
  <form method="get" action="review.html">

    <!-- SELECT (FIXED) -->
    <label for="product">Choose a Product</label>
    <select id="product" name="product" required>
      <option value="" disabled selected>-- Select a Product --</option>
      <option value="phone">Phone</option>
      <option value="laptop">Laptop</option>
      <option value="tablet">Tablet</option>
    </select>

    <!-- ⭐ STAR RATING (FIXED REQUIRED) -->
    <fieldset>
      <legend>Rating</legend>

      <div class="stars">
        <input type="radio" id="star5" name="rating" value="5" required>
        <label for="star5">★</label>

        <input type="radio" id="star4" name="rating" value="4" required>
        <label for="star4">★</label>

        <input type="radio" id="star3" name="rating" value="3" required>
        <label for="star3">★</label>

        <input type="radio" id="star2" name="rating" value="2" required>
        <label for="star2">★</label>

        <input type="radio" id="star1" name="rating" value="1" required>
        <label for="star1">★</label>
      </div>

    </fieldset>

    <!-- DATE -->
    <label for="date">Review Date</label>
    <input type="date" id="date" name="date" required>

    <!-- CHECKBOXES (FIXED IDS + LABELS) -->
    <fieldset>
      <legend>Features You Liked</legend>

      <input type="checkbox" id="design" name="features" value="design">
      <label for="design">Design</label>

      <input type="checkbox" id="performance" name="features" value="performance">
      <label for="performance">Performance</label>

      <input type="checkbox" id="battery" name="features" value="battery">
      <label for="battery">Battery</label>

      <input type="checkbox" id="price" name="features" value="price">
      <label for="price">Price</label>

    </fieldset>

    <!-- TEXTAREA -->
    <label for="review">Your Review</label>
    <textarea id="review" name="review" rows="4"></textarea>

    <!-- SUBMIT -->
    <button type="submit">Submit Review</button>

  </form>
</main>

<footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer>

</body>
</html>
