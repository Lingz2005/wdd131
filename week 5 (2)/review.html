<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="This page allows users to submit and track product reviews with ratings and installation dates.">
  <meta name="author" content="Jesse Chisom Nnadi">

  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head>

<body>

<header>
  <h1>Product Review Form</h1>
</header>

<main>
  <form id="reviewForm" method="get" action="review.html">

    <!-- Product -->
    <div class="form-group">
      <label for="product">Product Name <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product...</option>
      </select>
    </div>

    <!-- Rating (RADIO) -->
    <div class="form-group">
      <p>Overall Rating <span class="required">*</span></p>

      <label><input type="radio" name="rating" value="1" required> 1 ⭐</label>
      <label><input type="radio" name="rating" value="2"> 2 ⭐⭐</label>
      <label><input type="radio" name="rating" value="3"> 3 ⭐⭐⭐</label>
      <label><input type="radio" name="rating" value="4"> 4 ⭐⭐⭐⭐</label>
      <label><input type="radio" name="rating" value="5"> 5 ⭐⭐⭐⭐⭐</label>
    </div>

    <!-- Date -->
    <div class="form-group">
      <label for="date">Date of Installation <span class="required">*</span></label>
      <input type="date" id="date" name="date" required>
    </div>

    <!-- Checkboxes -->
    <div class="form-group">
      <p>Features Used</p>

      <label><input type="checkbox" name="features" value="design"> Design</label>
      <label><input type="checkbox" name="features" value="performance"> Performance</label>
      <label><input type="checkbox" name="features" value="battery"> Battery</label>
      <label><input type="checkbox" name="features" value="price"> Price</label>
    </div>

    <!-- Review -->
    <div class="form-group">
      <label for="review">Write Review</label>
      <textarea id="review" name="review" rows="4"></textarea>
    </div>

    <button type="submit">Submit Review</button>

  </form>

  <!-- Review Counter -->
  <p id="reviewCount"></p>
</main>

<footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer>

</body>
</html>
