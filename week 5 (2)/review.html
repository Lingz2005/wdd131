<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="This page allows users to submit and track product reviews with ratings and installation dates.">
  <meta name="author" content="Jesse Chisom Nnadi">

  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head>

<body>

<header>
  <h1>Product Review Form</h1>
</header>

<main>

  <form id="reviewForm" method="get" action="review.html">

    <!-- Product -->
    <div class="form-group">
      <label for="product">Product Name <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product...</option>
      </select>
    </div>

    <!-- Rating -->
    <div class="form-group">
      <p>Overall Rating <span class="required">*</span></p>

      <input type="radio" id="rating1" name="rating" value="1" required>
      <label for="rating1">1 ⭐</label>

      <input type="radio" id="rating2" name="rating" value="2" required>
      <label for="rating2">2 ⭐⭐</label>

      <input type="radio" id="rating3" name="rating" value="3" required>
      <label for="rating3">3 ⭐⭐⭐</label>

      <input type="radio" id="rating4" name="rating" value="4" required>
      <label for="rating4">4 ⭐⭐⭐⭐</label>

      <input type="radio" id="rating5" name="rating" value="5" required>
      <label for="rating5">5 ⭐⭐⭐⭐⭐</label>
    </div>

    <!-- Date -->
    <div class="form-group">
      <label for="date">Date of Installation <span class="required">*</span></label>
      <input type="date" id="date" name="date" required>
    </div>

    <!-- Features -->
    <div class="form-group">
      <p>Features Used</p>

      <input type="checkbox" id="design" name="features" value="design">
      <label for="design">Design</label>

      <input type="checkbox" id="performance" name="features" value="performance">
      <label for="performance">Performance</label>

      <input type="checkbox" id="battery" name="features" value="battery">
      <label for="battery">Battery</label>

      <input type="checkbox" id="price" name="features" value="price">
      <label for="price">Price</label>
    </div>

    <!-- Review -->
    <div class="form-group">
      <label for="review">Write Review</label>
      <textarea id="review" name="review" rows="4"></textarea>
    </div>

    <!-- Submit -->
    <button type="submit">Submit Review</button>

  </form>

  <!-- Counter -->
  <p id="reviewCount"></p>

</main>

<footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer>

</body>
</html>
