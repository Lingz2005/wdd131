<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="This page allows users to submit and track product reviews with ratings and installation dates.">
  <meta name="author" content="Jesse Chisom Nnadi">

  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head>

<body>

<header>
  <h1>Product Review Form</h1>
</header>

<main>
  <form id="reviewForm">

    <div class="form-group">
      <label for="product">Product Name <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="">Select a Product</option>
      </select>
    </div>

    <div class="form-group">
      <label for="rating">Overall Rating <span class="required">*</span></label>
      <select id="rating" name="rating" required>
        <option value="">Select Rating</option>
        <option value="1">1 ⭐</option>
        <option value="2">2 ⭐⭐</option>
        <option value="3">3 ⭐⭐⭐</option>
        <option value="4">4 ⭐⭐⭐⭐</option>
        <option value="5">5 ⭐⭐⭐⭐⭐</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">Date of Installation <span class="required">*</span></label>
      <input type="date" id="date" name="date" required>
    </div>

    <div class="form-group">
      <label for="review">Write Review</label>
      <textarea id="review" name="review" rows="4" placeholder="Write your experience..."></textarea>
    </div>

    <button type="submit">Submit Review</button>

  </form>

  <section class="review-counter">
    <p id="reviewCount"></p>
  </section>
</main>

<footer>
  <p>&copy; 2026 Jesse Chisom Nnadi</p>
</footer>

</body>
</html>
