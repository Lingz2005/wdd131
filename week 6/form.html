<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Join Football Hub">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Football Hub</title>
  <link rel="stylesheet" href="styles/styles.css">
  <script defer src="scripts/script.js"></script>
</head>

<body>

<header>
  <h1>Join Football Hub</h1>
</header>

<main>

<form id="joinForm">

  <label>Name:
    <input type="text" id="name" required>
  </label>

  <label>Email:
    <input type="email" id="email" required>
  </label>

  <label>Favorite Club:
    <input type="text" id="club">
  </label>

  <button type="submit">Submit</button>

</form>

<p id="formMessage"></p>

</main>

</body>
</html>
