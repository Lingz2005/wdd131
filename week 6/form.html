<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Join KickMaster Football Hub - Sign up to personalize your FC Mobile experience and get top tactics.">
    <meta name="author" content="Jesse Chisom Nnadi">
    <title>Join - KickMaster Football Hub</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script defer src="scripts/main.js"></script>
</head>

<body>
    <header class="header">
        <h1>⚽ KickMaster</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="form.html">Join</a>
            <button id="themeToggle" aria-label="Toggle theme">🌙</button>
        </nav>
    </header>

    <main class="form-container">
        <section class="form-section">
            <h2>Join the Hub</h2>
            <p>Enter your details to personalize your experience and save your preferences.</p>

            <form action="review.html" method="get" class="hub-form">
                <div class="form-group">
                    <label for="username">Manager / User Name:</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="favoriteTeam">Favorite FC Mobile Team:</label>
                    <input type="text" id="favoriteTeam" name="favoriteTeam" placeholder="e.g., Real Madrid">
                </div>

                <div class="form-group">
                    <label for="experienceLevel">Experience Level:</label>
                    <select id="experienceLevel" name="experienceLevel">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="expert">Expert / Pro</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Submit & Save</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KickMaster Football Hub</p>
    </footer>
</body>

</html>
