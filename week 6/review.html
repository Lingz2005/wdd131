<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review your submitted details for KickMaster Football Hub.">
    <meta name="author" content="Jesse Chisom Nnadi">
    <title>Review - KickMaster Football Hub</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script defer src="scripts/review.js"></script>
</head>

<body>
    <header class="header">
        <h1>⚽ KickMaster</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="form.html">Join</a>
            <button id="themeToggle" aria-label="Toggle theme">🌙</button>

    <main class="form-container">
        <section class="form-section">
            <h2>Submission Review</h2>

            <div id="review-content" class="tactic-card"
                style="margin: 20px auto; width: 100%; max-width: 400px; text-align: left;">
                <p><strong>Manager / User Name:</strong> <span id="display-username">N/A</span></p>
                <p><strong>Favorite FC Mobile Team:</strong> <span id="display-team">N/A</span></p>
                <p><strong>Experience Level:</strong> <span id="display-experience">N/A</span></p>
            </div>

            <div style="margin-top: 20px;">
                <p id="visit-count" style="font-size: 0.9rem; color: #FFD700;"></p>
            </div>

            <div style="margin-top: 30px;">
                <a href="index.html" class="submit-btn"
                    style="display: inline-block; padding: 10px 20px; background: #FFD700; color: #0A1F44; text-decoration: none; font-weight: bold; border-radius: 5px;">Return
                    to Home</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KickMaster Football Hub</p>
